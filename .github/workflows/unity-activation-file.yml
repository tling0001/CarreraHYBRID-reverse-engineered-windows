name: Request Unity activation file (legacy ALF)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-activation-file
  cancel-in-progress: false

jobs:
  request-activation-file:
    name: Generate and upload Unity .alf request
    runs-on: ubuntu-latest
    steps:
      - name: Generate manual activation request
        id: request
        uses: game-ci/unity-request-activation-file@v2

      - name: Verify activation request exists
        shell: bash
        env:
          ALF_PATH: ${{ steps.request.outputs.filePath }}
        run: |
          if [ -z "$ALF_PATH" ] || [ ! -s "$ALF_PATH" ]; then
            echo "::error::The activation action did not produce a non-empty .alf file."
            exit 1
          fi
          echo "Activation request generated: $(basename "$ALF_PATH")"
          echo "The file is uploaded as a workflow artifact; it is not printed into logs."

      - name: Upload .alf activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation-Request-ALF
          path: ${{ steps.request.outputs.filePath }}
          if-no-files-found: error
          retention-days: 7
